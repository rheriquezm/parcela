server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    root   /usr/share/nginx/html;
    index  index.html;

    # Necesario en Docker Desktop para macOS:
    # sendfile() falla sobre carpetas montadas del host y entrega la página vacía.
    sendfile      off;
    tcp_nopush    off;
    tcp_nodelay   on;

    # Compresión
    gzip              on;
    gzip_comp_level   5;
    gzip_min_length   256;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml;

    # Caché de imágenes
    location ~* \.(?:jpg|jpeg|png|webp|svg|ico|css|js)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
